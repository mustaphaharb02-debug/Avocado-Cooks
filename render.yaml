services:
  - type: web
    name: avo-cooks
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Single Page App: every URL must serve index.html so that
    # /recipes, /recipe/5 and /admin work on refresh and direct links.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
